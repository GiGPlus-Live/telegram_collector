name: Docker release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Build, test, and publish Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Prepare version and image name
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$GITHUB_REF_NAME"
          if [[ ! "$version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a release tag such as v1.0.0."
            exit 1
          fi
          if [[ "$(gh release view "$version" --json isDraft --jq .isDraft 2>/dev/null || true)" == false ]]; then
            echo "::notice::Release $version is already published."
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REF=ghcr.io/${GITHUB_REPOSITORY,,}:$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=telegram_collector-$version-linux-amd64.tar.gz" >> "$GITHUB_ENV"

      - name: Check out release
        if: steps.release.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: steps.release.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Linux amd64 image
        if: steps.release.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ${{ env.IMAGE_REF }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=collector-release
          cache-to: type=gha,scope=collector-release,mode=max

      - name: Smoke test the clean image
        if: steps.release.outputs.publish == 'true'
        run: |
          docker run --rm --network none -i --entrypoint node "$IMAGE_REF" --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import { once } from 'node:events';
          import { readdirSync } from 'node:fs';
          import { join } from 'node:path';

          const excluded = /^(?:\.env.*|\.git|\.github|\.local-legacy|mongo-(?:data|config|backups)|matrix-crypto|storage|temp|security-config\.js)$|\.(?:session|sqlite\w*|bson|log|wt|pem|key)$/i;
          function verifyFiles(directory) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === 'node_modules') continue;
              assert(!excluded.test(entry.name), 'Runtime data or credential file was found in the image');
              assert(!entry.isSymbolicLink(), 'Unexpected symlink in the application image');
              if (entry.isDirectory()) verifyFiles(join(directory, entry.name));
            }
          }
          verifyFiles('/app');

          const { default: app } = await import('./app.js');
          const server = app.listen(0, '127.0.0.1');
          await once(server, 'listening');
          try {
            const origin = 'http://127.0.0.1:' + server.address().port;
            const panel = await fetch(origin);
            assert.equal(panel.status, 200);
            assert.match(await panel.text(), /<html lang="en" dir="ltr">/);
            const languages = await fetch(origin + '/js/i18n.js');
            assert.equal(languages.status, 200);
            assert.match(await languages.text(), /initializeLanguage/);
            const accounts = await fetch(origin + '/api/telegram/accounts');
            assert.equal(accounts.status, 401);
            await accounts.text();
          } finally {
            server.close();
          }
          NODE

      - name: Prepare release assets
        if: steps.release.outputs.publish == 'true'
        run: |
          mkdir -p release
          docker image save "$IMAGE_REF" | gzip -1 > "release/$ARCHIVE"
          sed "s|^    image: gigplus/telegram_collector:.*$|    image: $IMAGE_REF|" compose.yaml > release/compose.yaml
          docker compose -f release/compose.yaml config --images backend | grep -Fx "$IMAGE_REF"
          (cd release && sha256sum "$ARCHIVE" compose.yaml > SHA256SUMS)

      - name: Publish version to GitHub Container Registry
        if: steps.release.outputs.publish == 'true'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_REF"

      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="$GITHUB_REF_NAME"
          if ! gh release view "$version" --json isDraft >/dev/null 2>&1; then
            cat > "${RUNNER_TEMP}/release-notes.md" <<EOF
          Built the Linux amd64 image \`$IMAGE_REF\`.

          Download \`compose.yaml\` and \`$ARCHIVE\` into the same folder. Load the image and start the collector with these commands.

          \`\`\`sh
          docker load --input $ARCHIVE
          docker compose up -d --wait
          \`\`\`

          \`SHA256SUMS\` contains checksums for both downloads. Keep the existing data folders alongside \`compose.yaml\` when upgrading.
          EOF
            gh release create "$version" --verify-tag --draft --title "Telegram Collector $version" --notes-file "${RUNNER_TEMP}/release-notes.md"
          fi
          gh release upload "$version" --clobber "release/$ARCHIVE" release/compose.yaml release/SHA256SUMS
          gh release edit "$version" --draft=false
